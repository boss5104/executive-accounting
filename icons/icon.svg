    <radialGradient id="glow" cx=".78" cy=".18" r=".6"><stop offset="0" stop-color="#e6cd8f" stop-opacity=".30"/><stop offset="1" stop-color="#e6cd8f" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow2" cx=".15" cy=".95" r=".55"><stop offset="0" stop-color="#3b5998" stop-opacity=".35"/><stop offset="1" stop-color="#3b5998" stop-opacity="0"/></radialGradient>
